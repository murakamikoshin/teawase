# XcodeGen 用。`brew install xcodegen` → このフォルダで `xcodegen generate` → Teawase.xcodeproj ができる
name: Teawase
options:
  bundleIdPrefix: com.koshinstudio
  deploymentTarget:
    iOS: "16.0"
targets:
  Teawase:
    type: application
    platform: iOS
    sources:
      - path: Teawase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koshinstudio.teawase
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: テアワセ！
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: Teawase/Teawase.entitlements
